<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#45454D"/>
  <!-- Livro amarelo: título em inglês na vertical -->
  <rect x="6" y="8" width="5" height="17" rx="1.2" fill="#FFD23F"/>
  <rect x="6" y="10" width="5" height="0.9" fill="#1C1C1F" fill-opacity="0.55"/>
  <text x="0" y="0" transform="translate(9.55 21.6) rotate(-90)" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="3.3" letter-spacing="0.25" fill="#1C1C1F" fill-opacity="0.75">BOOK</text>
  <rect x="7.6" y="22.4" width="1.8" height="1.3" rx="0.3" fill="#1C1C1F" fill-opacity="0.55"/>
  <!-- Livro verde: 漫画 (mangá) em pé, como lombada japonesa -->
  <rect x="12.5" y="6" width="5" height="19" rx="1.2" fill="#4CC38A"/>
  <rect x="12.5" y="8" width="5" height="0.9" fill="#1C1C1F" fill-opacity="0.5"/>
  <text x="15" y="14" text-anchor="middle" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', 'Meiryo', sans-serif" font-weight="700" font-size="3.6" fill="#1C1C1F" fill-opacity="0.75">漫</text>
  <text x="15" y="18.2" text-anchor="middle" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', 'Meiryo', sans-serif" font-weight="700" font-size="3.6" fill="#1C1C1F" fill-opacity="0.75">画</text>
  <rect x="14.1" y="22.4" width="1.8" height="1.3" rx="0.3" fill="#1C1C1F" fill-opacity="0.5"/>
  <!-- Volume que falta: contorno tracejado laranja -->
  <rect x="19.55" y="10.55" width="4.4" height="13.9" rx="1" fill="none" stroke="#FF8A3D" stroke-width="1.1" stroke-linecap="round" pathLength="40" stroke-dasharray="1.8 1.535"/>
  <rect x="21.15" y="14.2" width="1.2" height="5.4" rx="0.6" fill="#FF8A3D" fill-opacity="0.45"/>
</svg>
