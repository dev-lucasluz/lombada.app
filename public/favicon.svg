<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#595962"/>
      <stop offset="1" stop-color="#3a3a42"/>
    </linearGradient>
    <!-- Brilho à esquerda e sombra à direita, recortados no formato de cada livro -->
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="book1"><rect x="13" y="15" width="11" height="36" rx="2"/></clipPath>
    <clipPath id="book2"><rect x="26" y="10" width="11" height="41" rx="2"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Livro amarelo (inglês) -->
  <g clip-path="url(#book1)">
    <rect x="13" y="15" width="11" height="36" fill="#ffd23f"/>
    <rect x="13" y="15" width="11" height="36" fill="url(#spine)"/>
    <rect x="13" y="18.5" width="11" height="1.2" fill="#1c1c1f" fill-opacity="0.5"/>
    <rect x="13" y="45.3" width="11" height="1.2" fill="#1c1c1f" fill-opacity="0.5"/>
  </g>
  <text transform="translate(20.7 32.4) rotate(-90)" text-anchor="middle" font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-weight="800" font-size="6" letter-spacing="0.7" fill="#1c1c1f" fill-opacity="0.85">BOOK</text>

  <!-- Livro verde (japonês) -->
  <g clip-path="url(#book2)">
    <rect x="26" y="10" width="11" height="41" fill="#4cc38a"/>
    <rect x="26" y="10" width="11" height="41" fill="url(#spine)"/>
    <rect x="26" y="13.5" width="11" height="1.2" fill="#0f2a1d" fill-opacity="0.5"/>
    <rect x="26" y="45.3" width="11" height="1.2" fill="#0f2a1d" fill-opacity="0.5"/>
  </g>
  <g font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif" font-weight="700" font-size="7" text-anchor="middle" fill="#0f2a1d" fill-opacity="0.85">
    <text x="31.5" y="25">漫</text>
    <text x="31.5" y="33.6">画</text>
  </g>
  <circle cx="31.5" cy="40" r="1.6" fill="#0f2a1d" fill-opacity="0.45"/>

  <!-- Volume que falta: contorno laranja tracejado com "+" no centro -->
  <rect x="40.2" y="20.2" width="9.6" height="30" rx="2" fill="none" stroke="#ff8a3d" stroke-width="1.4" stroke-linecap="round" pathLength="64" stroke-dasharray="2.4 1.6"/>
  <path d="M45 32.9v4.6M42.7 35.2h4.6" stroke="#ff8a3d" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Prateleira por cima da base dos livros, para eles ficarem apoiados -->
  <rect x="8" y="50.4" width="48" height="3.6" rx="1.2" fill="#232328"/>
  <rect x="8" y="53" width="48" height="1" rx="0.5" fill="#000000" fill-opacity="0.25"/>
</svg>
