<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E9E8E3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181A" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica o tema salvo antes do primeiro desenho, para não piscar.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="description" content="Sua coleção de mangás e livros físicos e o histórico do que você lê online." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/anybody.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/zen-kaku-700.woff2" as="font" type="font/woff2" crossorigin />
    <title>Lombada</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
