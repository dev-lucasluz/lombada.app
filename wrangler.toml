# Worker + site estático da Cloudflare. O build (`npm run build`) gera dist/.
name = "lombada-app"
main = "worker/index.ts"
compatibility_date = "2026-09-30"

[assets]
directory = "./dist"
# Rotas desconhecidas devolvem o index.html (o app é uma SPA)
not_found_handling = "single-page-application"
# Só /api/* roda o Worker; o resto é servido direto, de graça e sem limite
run_worker_first = ["/api/*"]

# Variáveis públicas das rotas /api. Ficam aqui (e não só no painel) porque cada
# `wrangler deploy` apaga variáveis comuns que existam apenas no painel.
[vars]
SUPABASE_URL = "https://xttwxgkfhbzgkzyfwkcr.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_EiAoEn2P4ZrpU_lw2wDUpg_HT5K4_qa"
GEMINI_MODEL = "gemini-flash-lite-latest"
SCAN_DAILY_LIMIT = "30"

# Segredo (só no painel, tipo Secret): GEMINI_API_KEY
